# cloudbuild.yaml - Pipeline automat de build si deploy
# Se executa automat la fiecare push pe GitHub

steps:
  # Pasul 1: Construieste imaginea Docker cu codul nou
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rezervari-api:$SHORT_SHA'
      - '.'

  # Pasul 2: Trimite imaginea in Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rezervari-api:$SHORT_SHA'

  # Pasul 3: Deployeaza noua imagine pe Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'rezervari-api'
      - '--image=europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rezervari-api:$SHORT_SHA'
      - '--region=europe-west3'
      - '--platform=managed'

# Specifica modul de logare (obligatoriu cand folosesti service account custom)
options:
  logging: CLOUD_LOGGING_ONLY